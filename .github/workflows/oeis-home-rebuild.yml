name: oeis-home rebuild
on:
  push:
    branches: [main]
    paths: ["distributed/**"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: { group: oeis-home-rebuild, cancel-in-progress: false }
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --require-hashes -r distributed/requirements-lock.txt
      - name: Write the bot key (required: unsigned verified records are never trusted)
        env: { OEIS_HOME_BOT_KEY: "${{ secrets.OEIS_HOME_BOT_KEY }}" }
        run: |
          if [ -z "$OEIS_HOME_BOT_KEY" ]; then echo "::error::OEIS_HOME_BOT_KEY secret is missing; the rebuild cannot sign verified records"; exit 1; fi
          mkdir -p ~/.oeis-home && echo "$OEIS_HOME_BOT_KEY" | base64 -d > ~/.oeis-home/bot.ed25519 && chmod 600 ~/.oeis-home/bot.ed25519
      - name: Snapshot the previous page data (to detect new discoveries)
        run: cp distributed/docs/data.json /tmp/data.before.json 2>/dev/null || echo '{"positive_claims":[]}' > /tmp/data.before.json
      - name: Re-derive everything from the signed result files with main's code
        env:
          PYTHONPATH: ${{ github.workspace }}/distributed:${{ github.workspace }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m oeis_home.cli rebuild --bot-key ~/.oeis-home/bot.ed25519 --github-repo "${{ github.repository }}"
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distributed/verified distributed/ledger distributed/exports distributed/docs
          git diff --cached --quiet || git commit -m "oeis-home: rebuild [skip ci]" && git push
      - name: Open one roll-up issue for newly confirmed probable primes
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create discovery --description "confirmed probable prime awaiting second result / gp check" --color 0E8A16 2>/dev/null || true
          python - <<'PY'
          import json, subprocess
          before = {(p["n"], p["variant"]) for p in json.load(open("/tmp/data.before.json")).get("positive_claims", [])}
          after = json.load(open("distributed/docs/data.json"))["positive_claims"]
          new = [p for p in after if (p["n"], p["variant"]) not in before and p.get("ci_confirmed")]
          if not new:
              raise SystemExit(0)
          title = f"Discoveries: {len(new)} new probable prime(s) in lehmer-q2"
          marker = "<!-- oeis-home:rollup:" + ",".join(f"{p['n']}{p['variant']}" for p in new) + " -->"
          body = marker + "\n\nNew confirmed probable-prime lines (each needs a second result from a distinct account or a verifier key, "
                 "and a maintainer `gp` check recorded with `oeis-home rebuild --set-pari ...`):\n\n" + \
                 "\n".join(f"- n = {p['n']} ({p['variant']}, {p['digits']} digits), discovered by {p.get('discoverer_login', '?')}" for p in new)
          subprocess.run(["gh", "issue", "create", "--title", title, "--body", body, "--label", "discovery"], check=True)
          PY
