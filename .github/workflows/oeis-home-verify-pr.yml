name: oeis-home verify PR
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ["distributed/contributors/**", "distributed/claims/**", "distributed/results/**"]
permissions:
  contents: read
  pull-requests: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out the BASE branch (trusted code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the PR head and overlay ONLY the data directories
        run: |
          git fetch --no-tags origin +refs/pull/${{ github.event.pull_request.number }}/head:pr-head
          git checkout pr-head -- distributed/contributors distributed/claims distributed/results
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install pinned worker dependencies
        run: |
          python -m pip install --require-hashes -r distributed/requirements-lock.txt
          python -m pip install -e distributed --no-deps
      - name: Verify every changed file and recompute every line
        run: |
          oeis-home verify-pr --base ${{ github.event.pull_request.base.sha }} --head pr-head \
            --author-id ${{ github.event.pull_request.user.id }} --summary-file verification.json
      - name: Job summary
        if: always()
        run: |
          echo '## oeis-home verification' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat verification.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: verification, path: verification.json }
